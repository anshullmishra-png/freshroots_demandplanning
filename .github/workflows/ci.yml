name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check-bundle
      # Browser audit: accessibility (axe, WCAG 2.2 AA), 44px targets, ivory page, no sideways scroll, at desktop and phone width.
      # It builds the app again with UI_CHECK=1 to switch on the fixture pages, so it must run after the normal build checks.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: "true"
